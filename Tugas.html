<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animasi Bola & Teks Berjalan</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111827;
      font-family: sans-serif;
    }

    .container {
      width: 90%;
      max-width: 600px;
      background: #1f2937;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    /* Lintasan tempat bola bergerak */
    .track {
      width: 100%;
      height: 70px;
      background: #374151;
      border-radius: 35px;
      position: relative;
      overflow: hidden;
      margin-bottom: 20px;
    }

    /* Bola dan deklarasi animasinya */
    .ball {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      position: absolute;
      top: 10px;
      left: 10px;

      /* Kunci agar bola bergerak dan berubah warna */
      animation: 
        gerakBola 2.5s ease-in-out infinite alternate,
        gantiWarna 5s linear infinite;
    }

    /* 1. Animasi gerak kanan - kiri */
    @keyframes gerakBola {
      0% {
        /* Posisi awal (kiri) */
        transform: translateX(0);
      }
      100% {
        /* Posisi akhir (kanan): lebar trek dikurangi ukuran bola + padding */
        transform: translateX(calc(1150% - 50px));
      }
    }

    /* 2. Animasi perubahan warna & efek pendaran (glow) */
    @keyframes gantiWarna {
      0% {
        background-color: #ef4444; /* Merah */
        box-shadow: 0 0 16px #ef4444;
      }
      25% {
        background-color: #f59e0b; /* Oranye/Kuning */
        box-shadow: 0 0 16px #f59e0b;
      }
      50% {
        background-color: #10b981; /* Hijau */
        box-shadow: 0 0 16px #10b981;
      }
      75% {
        background-color: #3b82f6; /* Biru */
        box-shadow: 0 0 16px #3b82f6;
      }
      100% {
        background-color: #ec4899; /* Pink */
        box-shadow: 0 0 16px #ec4899;
      }
    }

    /* Teks berjalan menggunakan tag marquee */
    marquee {
      font-size: 20px;
      font-weight: bold;
      color: #16e0c5;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Area Bola Bergerak -->
    <div class="track">
      <div class="ball"></div>
    </div>

    <!-- Teks Berjalan -->
    <marquee behavior="scroll" direction="left" scrollamount="6">
      Selamat Belajar Transition &amp; Animation
    </marquee>
  </div>

</body>
</html>
