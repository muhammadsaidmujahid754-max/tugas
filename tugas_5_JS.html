<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menghitung Total Akumulasi Angka (while loop)</title>
</head>
<body>
    <script>
        let angka = 1;
        let total = 0;
        while(angka <=5)
        {
            total += angka;
            angka++;
        }
        console.log("Hasil total akumulasi:", total);
    </script>
</body>
</html>
