<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas 5 JS Mencetak Deret Angka Berurutan (for loop)</title>
</head>
<body>
    <script>
        for( let a = 1; a <= 10; a++){
            console.log(a);
        }

        for( let a = 5; a >= 1; a--){
            console.log(a);
        }
        console.log("Mulai!");
        
    </script>
</body>
</html>
